<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trip Map – Bridge Joint 0907-00-235</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',Arial,sans-serif; background:#1a1f2e; color:#e8eaf0; height:100vh; display:flex; flex-direction:column; }
#header { background:#12172a; border-bottom:2px solid #2e3a5c; padding:10px 18px; display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:8px; flex-shrink:0; }
#header h1 { font-size:15px; font-weight:700; color:#fff; }
#header p  { font-size:11px; color:#8892b0; margin-top:2px; }
#legend { display:flex; flex-wrap:wrap; gap:5px 10px; padding:8px 18px; background:#12172a; border-bottom:1px solid #2e3a5c; flex-shrink:0; }
.leg { display:flex; align-items:center; gap:5px; font-size:11px; color:#c8d0e0; white-space:nowrap; }
.leg-dot { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; flex-shrink:0; }
#controls { padding:6px 18px; background:#12172a; border-bottom:1px solid #2e3a5c; display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex-shrink:0; }
.filter-btn { padding:3px 9px; border-radius:4px; border:1px solid #2e3a5c; background:#1e2740; color:#c8d0e0; font-size:11px; cursor:pointer; }
.filter-btn.active { background:#2563eb; border-color:#3b82f6; color:#fff; }
.filter-btn:hover { background:#263660; }
#map { flex:1; }
.leaflet-popup-content-wrapper { background:#12172a !important; border:1px solid #3b5bdb !important; border-radius:10px !important; box-shadow:0 4px 20px rgba(0,0,0,0.6) !important; color:#e8eaf0 !important; padding:0 !important; }
.leaflet-popup-tip { background:#12172a !important; }
.leaflet-popup-content { margin:0 !important; width:auto !important; }
.leaflet-control-zoom a { background:#1e2740 !important; color:#c8d0e0 !important; border-color:#2e3a5c !important; }
.leaflet-control-zoom a:hover { background:#263660 !important; }
.leaflet-control-attribution { background:rgba(18,23,42,0.8) !important; color:#555 !important; }
</style>
</head>
<body>
<div id="header">
  <div>
    <h1>Mobilization Trip Map — Control 0907-00-235 | San Angelo District</h1>
    <p>9 trips (A–I) color-coded by mobilization group &nbsp;|&nbsp; Click any marker for trip details</p>
  </div>
</div>
<div id="legend"></div>
<div id="controls">
  <span style="font-size:11px;color:#8892b0;">Filter:</span>
  <button class="filter-btn active" data-trip="all">All Trips</button>
  <button class="filter-btn" data-trip="priority">Priority A–C</button>
  <button class="filter-btn" data-trip="cluster">Clusters D–F</button>
  <button class="filter-btn" data-trip="outlier">Outliers G–I</button>
  <button class="filter-btn" id="reset-btn" style="margin-left:8px;">Reset View</button>
  <span style="font-size:11px;color:#8892b0;" id="showing">Showing 33 locations</span>
</div>
<div id="map"></div>
<script>
var TRIPS = {
  A:{color:'#ef4444',label:'A',desc:'IH-10 WB/EB Devils River',       county:'Sutton',    lf:1596,days:16.0,priority:'priority'},
  B:{color:'#f97316',label:'B',desc:'IH-10 RM 1312 & Turkey Roost',   county:'Sutton',    lf:804, days:5.4, priority:'priority'},
  C:{color:'#a855f7',label:'C',desc:'SL 467 / IH-10 Beam Repair',     county:'Sutton',    lf:235, days:0,   priority:'priority'},
  D:{color:'#2563eb',label:'D',desc:'US 67 San Angelo Cluster',        county:'Tom Green', lf:1495,days:11.6,priority:'cluster'},
  E:{color:'#0891b2',label:'E',desc:'RM 2034 Concho River',            county:'Tom Green', lf:106, days:0.7, priority:'cluster'},
  F:{color:'#65a30d',label:'F',desc:'US 67 & RM 2469 Irion Co.',       county:'Irion',     lf:945, days:6.3, priority:'cluster'},
  G:{color:'#ca8a04',label:'G',desc:'Sterling + Runnels Counties',     county:'Sterling/Runnels',lf:296,days:2.0,priority:'outlier'},
  H:{color:'#059669',label:'H',desc:'Kimble + Menard Counties',        county:'Kimble/Menard',lf:321,days:2.6,priority:'outlier'},
  I:{color:'#7c3aed',label:'I',desc:'Kimble US 290 + Real SH 55',     county:'Kimble/Real',lf:927,days:6.2, priority:'outlier'},

var DATA = [
  {idx:1, lat:31.22734698,lng:-100.82860961,trip:'F',road:'US 67',feat:'Rock Pen Draw',cl3:368,cl7:0},
  {idx:2, lat:31.27657238,lng:-100.81436972,trip:'F',road:'US 67',feat:'Coon Hollow',cl3:322,cl7:0},
  {idx:3, lat:31.30481531,lng:-100.79529708,trip:'F',road:'US 67',feat:'Lopez Creek',cl3:230,cl7:0},
  {idx:4, lat:31.29525995,lng:-100.88090153,trip:'F',road:'RM 2469',feat:'Lopez Creek',cl3:25,cl7:0},
  {idx:5, lat:30.29652723,lng:-99.40802330, trip:'I',road:'US 290',feat:'Little Devils River',cl3:255,cl7:0},
  {idx:6, lat:30.30038476,lng:-99.30833543, trip:'I',road:'US 290',feat:'Pedernales River',cl3:210,cl7:0},
  {idx:7, lat:30.52691558,lng:-99.84241299, trip:'H',road:'FM 2291',feat:'IH-10',cl3:0,cl7:145},
  {idx:8, lat:30.94283344,lng:-99.77083004, trip:'H',road:'US 190',feat:'Volkmann Draw',cl3:30,cl7:0},
  {idx:9, lat:30.95482062,lng:-99.73653565, trip:'H',road:'US 190',feat:'Chapman Draw',cl3:30,cl7:0},
  {idx:10,lat:30.95482062,lng:-99.73653565, trip:'H',road:'US 190',feat:'Scalp Creek',cl3:77,cl7:0},
  {idx:11,lat:30.91682946,lng:-99.80672871, trip:'H',road:'FM 2092',feat:'Las Moras Creek',cl3:39,cl7:0},
  {idx:12,lat:29.68336768,lng:-100.01824468,trip:'I',road:'SH 55',feat:'Camp Wood Creek',cl3:378,cl7:0},
  {idx:13,lat:29.63546713,lng:-100.00651061,trip:'I',road:'SH 55',feat:'Ranch Creek',cl3:84,cl7:0},
  {idx:14,lat:32.02088789,lng:-100.03878098,trip:'G',road:'FM 1677',feat:'Big Coyote Creek Br.',cl3:138,cl7:0},
  {idx:15,lat:31.96636586,lng:-99.93991068, trip:'G',road:'RM 1770',feat:'Bluff Creek',cl3:51,cl7:0},
  {idx:16,lat:31.97959143,lng:-99.86688577, trip:'G',road:'RM 1770',feat:'Elm Creek',cl3:51,cl7:0},
  {idx:17,lat:31.7470307, lng:-101.03881427,trip:'G',road:'SH 163',feat:'Sterling Creek',cl3:56,cl7:0},
  {idx:18,lat:30.63186297,lng:-100.86539401,trip:'A',road:'IH-10 WB',feat:'Devils River',cl3:0,cl7:798},
  {idx:19,lat:30.63164658,lng:-100.86557690,trip:'A',road:'IH-10 EB',feat:'Devils River',cl3:0,cl7:798},
  {idx:20,lat:30.62668983,lng:-100.85174619,trip:'B',road:'IH-10 WB',feat:'IH-10 Turnaround',cl3:170,cl7:0},
  {idx:21,lat:30.62644856,lng:-100.85187147,trip:'B',road:'IH-10 EB',feat:'IH-10 Turnaround',cl3:170,cl7:0},
  {idx:22,lat:30.62421938,lng:-100.84599799,trip:'B',road:'IH-10 EB',feat:'Turkey Roost Draw',cl3:224,cl7:0},
  {idx:23,lat:30.62438184,lng:-100.84568380,trip:'B',road:'IH-10 WB',feat:'Turkey Roost Draw',cl3:240,cl7:0},
  {idx:24,lat:30.58276624,lng:-100.65792610,trip:'C',road:'SL 467',feat:'IH-10 (Beam Repair)',cl3:235,cl7:0},
  {idx:25,lat:31.46680827,lng:-100.44891992,trip:'D',road:'US 67 SB FTG RD',feat:'N. Concho River',cl3:204,cl7:0},
  {idx:26,lat:31.46619593,lng:-100.44786909,trip:'D',road:'US 67 NB FTG RD',feat:'N. Concho River',cl3:400,cl7:0},
  {idx:27,lat:31.45127788,lng:-100.48812720,trip:'D',road:'Glenna St',feat:'US 67',cl3:170,cl7:0},
  {idx:28,lat:31.45975825,lng:-100.46261520,trip:'D',road:'Van Buren St',feat:'US 67',cl3:108,cl7:0},
  {idx:29,lat:31.46138280,lng:-100.45857760,trip:'D',road:'N Jefferson St',feat:'US 67',cl3:0,cl7:179},
  {idx:30,lat:31.45763263,lng:-100.46702730,trip:'D',road:'Howard St',feat:'US 67',cl3:108,cl7:0},
  {idx:31,lat:31.47400801,lng:-100.43202500,trip:'D',road:'N Main St',feat:'US 67',cl3:0,cl7:166},
  {idx:32,lat:31.47542249,lng:-100.41321840,trip:'D',road:'N Bell St',feat:'US 67',cl3:0,cl7:160},
  {idx:33,lat:31.66117052,lng:-100.74137128,trip:'E',road:'RM 2034',feat:'Concho River',cl3:106,cl7:0},
];

// Build legend
var legEl = document.getElementById('legend');
Object.keys(TRIPS).forEach(function(k){
  var t=TRIPS[k];
  var d=document.createElement('div'); d.className='leg';
  d.innerHTML='<div class="leg-dot" style="background:'+t.color+';">'+k+'</div><span>Trip '+k+' — '+t.lf+' LF'+(t.days?' / '+t.days+' days':'')+'</span>';
  legEl.appendChild(d);
});

(function init(){
  if(typeof L==='undefined'){setTimeout(init,100);return;}
  var map=L.map('map').setView([30.8,-100.3],7);
  var streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19});
  var satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'&copy; Esri',maxZoom:19});
  var topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenTopoMap',maxZoom:17});
  streets.addTo(map);
  L.control.layers({'Street Map':streets,'Satellite':satellite,'Topographic':topo},{},{position:'topright'}).addTo(map);
  L.control.scale({imperial:true,metric:false}).addTo(map);

  var markerLayer=L.layerGroup().addTo(map);
  var currentFilter='all';

  function render(filter){
    markerLayer.clearLayers();
    var vis=DATA.filter(function(d){ return filter==='all'||TRIPS[d.trip].priority===filter; });
    document.getElementById('showing').textContent='Showing '+vis.length+' locations';
    vis.forEach(function(d){
      var t=TRIPS[d.trip]; var r=12;
      var total=d.cl3+d.cl7;
      if(total>600) r=16; else if(total>200) r=13;
      var m=L.circleMarker([d.lat,d.lng],{radius:r,fillColor:t.color,color:'#000',weight:1.5,opacity:0.9,fillOpacity:0.88}).addTo(markerLayer);
      var days=(d.cl3/150+d.cl7/100).toFixed(1);
      m.bindPopup(
        '<div style="padding:13px 15px;min-width:210px;font-family:Segoe UI,Arial,sans-serif;">'+
        '<div style="font-size:11px;font-weight:700;color:'+t.color+';text-transform:uppercase;letter-spacing:0.07em;">Trip '+d.trip+' &nbsp;·&nbsp; '+t.desc+'</div>'+
        '<div style="font-size:14px;font-weight:700;color:#fff;margin:4px 0 2px;">Index '+d.idx+' — '+d.feat+'</div>'+
        '<div style="font-size:12px;color:#a8b4cc;">'+d.road+'</div>'+
        '<hr style="border:none;border-top:1px solid #2e3a5c;margin:7px 0;"/>'+
        (d.cl3?'<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;"><span style="color:#8892b0;">CL3 (438-7004)</span><span style="font-weight:700;color:#f97316;">'+d.cl3+' LF</span></div>':'')+
        (d.cl7?'<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;"><span style="color:#8892b0;">CL7 (438-7007)</span><span style="font-weight:700;color:#a855f7;">'+d.cl7+' LF</span></div>':'')+
        '<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;"><span style="color:#8892b0;">Est. production</span><span style="font-weight:600;">~'+days+' days</span></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;"><span style="color:#8892b0;">Trip total</span><span style="font-weight:600;">'+t.lf+' LF / '+t.days+' days</span></div>'+
        '</div>',{maxWidth:280}
      );
      var icon=L.divIcon({className:'',html:'<div style="width:'+(r*2)+'px;height:'+(r*2)+'px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.8);pointer-events:none;">'+d.trip+'</div>',iconSize:[r*2,r*2],iconAnchor:[r,r]});
      L.marker([d.lat,d.lng],{icon:icon,interactive:false,zIndexOffset:1000}).addTo(markerLayer);
    });
  }
  render('all');

  document.querySelectorAll('.filter-btn[data-trip]').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.filter-btn[data-trip]').forEach(function(b){b.classList.remove('active');});
      this.classList.add('active'); currentFilter=this.dataset.trip; render(currentFilter);
    });
  });
  document.getElementById('reset-btn').addEventListener('click',function(){
    map.setView([30.8,-100.3],7); currentFilter='all';
    document.querySelectorAll('.filter-btn[data-trip]').forEach(function(b){b.classList.remove('active');});
    document.querySelector('.filter-btn[data-trip="all"]').classList.add('active');
    render('all');
  });
})();
</script>
</body>
</html>
